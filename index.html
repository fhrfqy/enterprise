<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}

a{color:var(--acc)}.skip{font-weight:600;text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}

button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--acc)}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;margin:7px 0}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
code{font:.92em ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:1px 4px;border-radius:4px}
pre input{font:inherit;width:11ch;border:0;border-bottom:2px solid var(--acc);background:transparent;color:var(--ink);padding:0 2px}
pre input.ok{border-color:var(--ok);color:var(--ok)}pre input.bad{border-color:var(--bad);color:var(--bad)}
textarea{width:100%;min-height:150px;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--code);color:var(--ink)}
.mute{color:var(--mute)}.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.why{border-left:4px solid var(--acc);padding:2px 12px;margin-top:10px}.why.bad{border-color:var(--bad)}.why.ok{border-color:var(--ok)}
.figure{margin:10px 0;text-align:center}.figure img{max-width:100%;background:#fff;border:1px solid var(--line)}figcaption{font-size:13px;color:var(--mute);margin-top:2px}
.fig{display:inline-block;text-align:left;background:#fff;color:#000;border:1px solid #333;padding:8px 12px;font:15px/1.4 "Times New Roman",Georgia,serif;min-width:210px}
.fig .in{border:1px solid #888;border-radius:3px;padding:2px 6px;margin:2px 0 6px;min-height:1.7em;background:#fafafa;font:14px Arial,sans-serif}
.fig .btn{display:inline-block;border:1px solid #777;border-radius:3px;padding:2px 10px;background:#eee;font:14px Arial,sans-serif;margin-top:6px}
.fig table{border-collapse:collapse}.fig td,.fig th{border:1px solid #333;padding:1px 10px;text-align:left}.fig h4{margin:0 0 6px;font-size:19px}
details.card>summary{cursor:pointer;font:700 1.15rem Georgia,"Iowan Old Style",serif;padding:2px 0}
details.card[open]>summary{margin-bottom:8px}
.paper{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.paper a{font-weight:600}
.hide{display:none}label.ck{display:block;margin:4px 0}ul{padding-left:20px;margin:.3em 0}li{margin:.25em 0}

/* ============ NOTES (generated from your slides, a + b parts) ============ */
const N={
c1:[
['Java and its editions (1a)',['Java is general-purpose: servers, desktop, mobile and web.','Editions: `JSE` (desktop/servers), `JEE` (server-side: servlets, JSP), `JME` (phones, set-top boxes).','Popular IDEs: NetBeans, Eclipse, IntelliJ IDEA.']],
['Objects, classes, constructors (1a)',['An object has identity, state (data fields) and behaviour (methods). A class defines objects of the same type.','A constructor has the same name as the class and no return type, not even `void`. It is invoked with `new`.','A default no-arg constructor is supplied only if you declare no constructor.','Create and use: `Circle c = new Circle(5.0);` then `c.radius`, `c.getArea()`.']],
['Inheritance, super, overriding (1a)',['`extends` makes a subclass (is-a). It inherits everything except private members. UML: solid arrow, unfilled triangle, pointing to the parent.','Constructors are not inherited. The child’s constructor calls `super(...)` as its first line. `super.method()` calls the overridden parent version.','Overriding = same signature in parent and child (a `final` method cannot be overridden). Overloading = same name, different parameters, same class.','Shadowing variables should be avoided.']],
['Polymorphism and instanceof (1a)',['A parent-type variable can refer to any subclass object: `Pet p = new Cat();`. The real object’s method runs.','`x instanceof T` is true if x is a T or a subclass of T. A Dolphin (Mammal, Animal) is `instanceof` all three.']],
['Access levels (1b)',['`private`: class only. default (no keyword): same package. `protected`: package + subclasses (any package). `public`: everywhere.','A class or interface can only be public or default. Members can be any of the four.','A subclass method may not be more restrictive than the parent’s. Private methods are not inherited. `main` is public so the interpreter can call it.','Private fields + public getters/setters = encapsulation.']],
['Abstract classes (1b)',['Abstract class: cannot be instantiated. Abstract method: no body, ends with `;`, cannot be private or static.','A subclass is concrete only if it implements every abstract method; otherwise it must be abstract too.','Its constructor still runs through `super()`.'],`abstract class Card {\n  String recipient;\n  public abstract void greeting();\n}\nCard card = new Holiday("Amy");  // polymorphism\ncard.greeting();`],
['Interfaces (1b)',['An interface holds constants and method declarations (a checklist). Fields are public static final; methods are public.','A class extends one parent but can implement many interfaces: `class Toy extends Goods implements Taxable`.','Interface = share behaviour; inheritance = share code.']]
],
c2:[
['Why Java EE (2a)',['Two-tier client-server: the client did presentation, business logic and data access. Hard to upgrade or reuse, not scalable, unsuited to the internet.','Java EE tiers: client, web, business, and EIS (enterprise information system).','Java platforms: SE, EE, ME, JavaFX. A web app (servlets, JSPs, classes, HTML, images) deploys as a `WAR` (zip) file.']],
['History (2a)',['1999 J2EE 1.2 (Sun). 2006 Java EE 5 (dropped “J2”). 2010 Oracle buys Sun. 2017 donated to Eclipse Foundation. 2018 renamed Jakarta EE (Jakarta EE 8 released Sept 2019).','Every spec = APIs + specification, Technology Compatibility Kit (TCK), compatible implementation.']],
['Servers, containers, components (2a)',['App servers: GlassFish, Tomcat, TomEE, WildFly, WebLogic, WebSphere.','Containers: EJB container, web container (servlets, JSP), application client container, applet container.','Components: application clients/applets, web components (servlet, JSF, JSP), enterprise beans.','Request flow: HTTP request → `HttpServletRequest` → web component → `HttpServletResponse` → HTTP response.']],
['Servlet, JSP, EJB, MVC (2a)',['Servlet life cycle: load class, create instance, `init()`, then `service()` per request.','JSP mixes static HTML with Java elements; file extension `.jsp`.','EJB = server-side business logic. Session beans: stateful (one client, keeps state), stateless (many clients), singleton (one per app). Message-driven bean: asynchronous listener.','MVC: Model manages data, View is the UI (JSP), Controller sits between them and handles input.']],
['HTML basics (2b)',['Structure: `<!DOCTYPE html>`, `<html>`, `<head>`, `<body>`. Tags: `<b> <strong> <i> <u> <p> <br> <hr> <div> (block) <span> (inline)`.','Lists `<ul>/<ol>` with `<li>`. Image `<img src alt width height>`. Link `<a href target="_blank">`. Table: `<table> <tr> <th> <td>`. Headings `<h1>` (largest) to `<h6>`.']],
['HTML forms (2b)',['`<form action method>`. If action is omitted, it submits to the current page. GET (default) puts data in the URL (limited size, not for sensitive data); POST hides it and has no size limit.','Each input needs a `name` or it isn’t sent.','Types: text, password, submit, reset, radio (one choice), checkbox (zero or more), date, datetime-local, email, month, number (min, max, step, value).','`<select><option>` (selected, size), `<textarea rows cols>`, `<button>`.','Attributes: `readonly` (can’t edit), `disabled` (unusable, not sent), `placeholder` (hint), `required` (must fill).']]
],
c3:[
['Servlet basics (3a)',['Servlets are Java classes running on the server inside a container (Tomcat = web server + servlet server). They usually have no `main` method.','Most extend `HttpServlet` (some `GenericServlet`). The server keeps one servlet alive and calls it for every request.']],
['Life cycle (3a)',['Load and instantiate, `init()` (once), `service()` (every request), `destroy()` (once).','`HttpServlet.service()` dispatches to `doGet`, `doPost`, `doPut`, `doDelete` and others. Signature: `protected void doXxx(HttpServletRequest, HttpServletResponse) throws ServletException, IOException`.']],
['GET vs POST (3a)',['GET: data in URL/header, limited size, not secure, bookmarkable, idempotent, default.','POST: data in message body, large size, not shown in URL, not bookmarkable, non-idempotent.']],
['Request data (3a)',['`getParameter("x")` returns one String, or null if missing. `getParameterValues("x")` returns `String[]` (checkboxes).','Convert as needed: `Integer.parseInt(request.getParameter("age"))`.','Output: `response.setContentType("text/html"); PrintWriter out = response.getWriter();`']],
['Creating a servlet (3a)',['Steps: create project, create servlet, check deployment descriptor, deploy, access.','`@WebServlet("/welcome")` replaces the web.xml declaration and mapping (Servlet 3.0, Tomcat 7+).','web.xml: `<servlet>` (`<servlet-name>`, `<servlet-class>`), `<servlet-mapping>` (`<url-pattern>` = the URL users type).']],
['Session tracking (3a)',['HTTP is stateless, so related requests need tracking. Four ways: hidden form values, cookies, URL rewriting, `HttpSession`.','Cookies: small name=value pairs stored in the browser, sent with every request to that server. URL rewriting: a parameter at the end of the URL.','`HttpSession s = request.getSession(true);` gets or creates a session. The server keeps the data (secure, large data), the client holds only the session ID.']],
['Java EE to Jakarta EE (3b)',['After the move to Eclipse Foundation, `javax.*` became `jakarta.*`.','Tomcat 10+ uses Jakarta; Tomcat 9 and earlier use javax. Old apps need code changes (or the migration tool / `webapps-javaee` folder, which auto-converts).','Only the prefix changes: `javax.servlet.http.HttpServlet` becomes `jakarta.servlet.http.HttpServlet`.']]
],
c4:[
['What is JSP (4a)',['Mostly HTML with the `.jsp` extension plus JSP tags for dynamic content.','Translated into a servlet, compiled at the first request (a bit slow), then executed through the servlet’s service method.','Benefits: compiled so fast, easy to embed dynamic elements in HTML, separates roles (developers vs designers).']],
['JSP constructs and comments (4a)',['Scriptlet `<% statements %>`, expression `<%= expr %>` (printed to output), declaration `<%! field or method %>`.','HTML comment `<!-- -->` appears in output; JSP comment `<%-- --%>` does not.']],
['Implicit objects (4a)',['Eight: `request`, `response`, `out`, `session`, `application`, `config`, `pageContext`, `page`.','`session` is per client; `application` (ServletContext) is shared by all clients.','request: `getParameter`, `getAttribute`, `setAttribute`. response: `setContentType`, `addCookie`, `sendRedirect`.']],
['Directives (4a)',['Syntax `<%@ directive attr="value" %>`. Three: `page` (imports, content type), `include` (inserts a file at translation time), `taglib` (use tag libraries).']],
['JSTL (4a)',['Tags instead of scriptlet code. Groups: core, formatting, SQL, XML, functions. Prefix `c` for core: `<%@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>`.','Core: `c:out` (prints, escapes), `c:set`, `c:remove`, `c:if`, `c:choose/c:when/c:otherwise` (like switch or if-else), `c:forEach`, `c:forTokens`, `c:import`, `c:redirect`, `c:url`. Formatting prefix `fmt`.'],`<c:set var="income" scope="session" value="\${4000*4}"/>\n<c:if test="\${income > 8000}">\n  <c:out value="\${income}"/>\n</c:if>\n<c:forEach var="i" begin="1" end="5">\n  Item <c:out value="\${i}"/><br/>\n</c:forEach>`],
['Servlet + JSP in MVC: Handbag example (4b)',['Flow: `addHandbag.html` (form) → `HandbagController` servlet → `viewHandbag.jsp`. The Model (e.g. a Handbag JavaBean) isn’t used yet.','Controller: `getParameter` for each field, `setAttribute` to store it, then `request.getRequestDispatcher("/example/viewHandbag.jsp").forward(request, response)`.','View: scriptlet style `<%= request.getAttribute("name") %>` or JSTL style `<c:out value="\${name}" />` (safer, avoids XSS).','The form’s action is `../HandbagController` because the HTML sits in the `example/` folder. `charset=UTF-8` shows special characters correctly.']],
['JavaBeans in JSP (from the sample tests)',['A bean is a public class with a public no-argument constructor, private properties, and public `getXxx()` / `setXxx()` methods. A boolean getter is `isXxx()`.','`<jsp:useBean id="converter" class="AccountBean" scope="page" />` creates (or finds) the bean. Scopes: page, request, session, application.','`<jsp:getProperty name="converter" property="total" />` prints a property; `<jsp:setProperty name="converter" property="total" value="100" />` sets one.']]
]};

const CH=[
{id:'c1',t:'Chapter 1: Review of OOP',s:'Classes, inheritance, access, abstract, interface',q:[
['Which statement about constructors is true?',['They may declare void as a return type','They have the class’s name and no return type','They are inherited by subclasses','They are called with the extends keyword'],1,'A constructor has the class name and no return type, not even void. Constructors are not inherited, and new invokes them.'],
['When does Java supply a default no-arg constructor?',['Always','Only if the class declares no constructor','Only for abstract classes','Only if the class extends another'],1,'It is added automatically only when you write no constructor. Once you declare one, it disappears.'],
['Where must super(...) appear in a child constructor?',['Last line','First line','Anywhere','In a static block'],1,'The parent part of the object must be initialised first, so super(...) is the first line.'],
['Same name and parameters in parent and child is called:',['Overloading','Overriding','Shadowing','Encapsulation'],1,'Overriding = same signature in parent and child. Overloading = same name, different parameters in one class.'],
['Which method cannot be overridden?',['A public method','A final method','A protected method','A void method'],1,'A method declared final cannot be overridden.'],
['Mammal extends Animal, Dolphin extends Mammal. Dolphin d = new Dolphin(); What is d instanceof Animal?',['false','true','Compile error','null'],1,'A subclass object is an instance of every ancestor (Dolphin IS-A Mammal IS-A Animal).'],
['A field has no access modifier. Who can access it?',['Anyone','Only the class','Any class in the same package','Same package and subclasses anywhere'],2,'No modifier = default (package) access. Subclasses anywhere describes protected.'],
['Which classes can access a protected member?',['Only the declaring class','Same package plus subclasses in other packages','Only subclasses','Every class'],1,'Protected = package + subclasses. Option 4 is public, option 1 is private.'],
['Which two modifiers cannot be applied to a class or interface?',['public and default','protected and private','public and protected','default and private'],1,'A class or interface can only be public or default. Protected and private are for members.'],
['Superclass method is protected. Which subclass version is NOT allowed?',['protected','public','private','All allowed'],2,'An override cannot be more restrictive. Private is narrower than protected.'],
['What happens to a private superclass method in a subclass?',['Inherited and usable','Inherited read-only','Not inherited at all','Becomes protected'],2,'Private methods are not inherited, so no override rule applies.'],
['What is the result?',['Runs, greeting() does nothing','Compile error: abstract class cannot be instantiated','Runtime error','Works if Card has a constructor'],1,'You can never create an object from an abstract class; instantiate a concrete subclass instead.','abstract class Card { abstract void greeting(); }\nCard c = new Card();'],
['Which is a valid abstract method?',['public abstract void greeting() { }','public abstract void greeting();','private abstract void greeting();','public static abstract void greeting();'],1,'No body and ends with a semicolon. Private and static methods can’t be abstract.'],
['Circle extends abstract Shape but implements only getArea(), not getPerimeter(). Circle must be:',['Concrete','Declared abstract too','An interface','Private'],1,'A subclass is concrete only if it implements all abstract methods; otherwise it stays abstract.'],

['How does Java give “multiple inheritance” of behaviour?',['Extend two classes','Implement several interfaces','Two abstract classes','Protected classes'],1,'A class extends one parent but may implement many interfaces.'],
['Correct declaration of Book (parent Goods, interface Taxable)?',['class Book implements Goods extends Taxable','class Book extends Goods implements Taxable','class Book extends Goods, Taxable','class Book implements Goods, Taxable'],1,'Class → extends, interface → implements, extends first.'],
['Card card = new Holiday("Amy"); card = new Birthday("Cindy"); card.greeting(); runs:',['Holiday’s','Birthday’s','Card’s','Compile error'],1,'Polymorphism: the object the variable currently holds decides the method.']
]},
{id:'c2',t:'Chapter 2: Intro to JEE and HTML',s:'Architecture, containers, beans, MVC, forms',q:[
['Why was the two-tier design hard to scale?',['Server did all logic','The client handled presentation, business logic and data access, so reuse and upgrades were hard','Too many tiers','No databases'],1,'In two-tier the client carries everything, so it is hard to enhance and not suited to the internet.'],
['Which are the Java EE tiers?',['Client, web, business, EIS','Client, controller, model, view','Servlet, JSP, applet','Presentation, kernel, shell'],0,'Client, web, business and EIS tiers. Model/view/controller is the MVC pattern, not the tiers.'],

['<input type="number" min="1" max="10" step="2" value="3">. Allowed values step from min:',['1,2,3...','1,3,5,7,9','2,4,6,8,10','3,6,9'],1,'step=2 starting at min=1 gives 1,3,5,7,9. value=3 is only the default.'],

{id:'c3',t:'Chapter 3: Servlet and Jakarta migration',s:'Life cycle, GET/POST, sessions, javax to jakarta',q:[
['Which life-cycle methods run only once?',['service and doGet','init and destroy','doPost and destroy','init and service'],1,'init() runs once at start, destroy() once at the end; service() runs for every request.'],

['What does HttpServlet.service() do?',['Dispatches to doGet, doPost, etc.','Destroys the servlet','Parses HTML','Opens a database'],0,'It dispatches each HTTP request to the matching doXxx method.'],

['request.getSession(true) returns:',['Always a new session','The current session, or a new one if none exists','null if none exists','Destroys the session'],1,'With true it creates a session only when the client has none.'],

['Which declares a field or method in the servlet?',['<% int i; %>','<%! int i; %>','<%= int i %>','<%@ int i %>'],1,'The declaration form is <%! ... %>. A scriptlet just inserts statements in the service method.'],
['Which comment does NOT appear in the HTML sent to the browser?',['<!-- -->','<%-- --%>','// in HTML','<comment>'],1,'<%-- --%> is stripped on the server; HTML comments are sent.'],
['How many implicit objects does JSP provide?',['4','8','12','3'],1,'request, response, out, session, application, config, pageContext, page.'],
['session vs application?',['Same thing','session is per client; application is shared by all clients','application is per client','session stores HTML'],1,'application is the ServletContext shared by everyone; session belongs to one client.'],
['Which directive sets imports and content type?',['page','include','taglib','jsp'],0,'page = page information (imports, content type). include inserts a file; taglib loads tag libraries.'],
['What does <%@ include file="x.html" %> do?',['Inserts the file when the page is translated to a servlet','Loads it in the browser','Imports a taglib','Declares a variable'],0,'It inserts the file at translation time, at the spot where it is placed.'],
['Main benefit of JSTL?',['Tags instead of scriptlet code','Faster network','Replaces HTML','Replaces servlets'],0,'JSTL lets you program with tags instead of Java code.'],
['Which JSTL tag works like if-else / switch?',['c:if','c:choose with c:when and c:otherwise','c:forEach','c:set'],1,'c:if has no else. c:choose gives mutually exclusive branches.'],
['<c:forEach var="i" begin="1" end="5"> repeats its body:',['4 times','5 times','6 times','forever'],1,'begin and end are both inclusive: 1 to 5.'],
['<c:set var="salary" scope="session" value="${2000*2}"/> then <c:out value="${salary}"/> prints:',['2000*2','4000','0','Nothing'],1,'c:set evaluates the expression and stores 4000 in session scope.'],
['In the Handbag example, which file is the Controller?',['addHandbag.html','HandbagController.java','viewHandbag.jsp','web.xml'],1,'The servlet receives data, stores it and forwards. The form and JSP are the View.'],
['Which MVC part is missing from the example?',['View','Controller','Model (e.g. a Handbag JavaBean)','None'],2,'The notes say the Model isn’t present but could be added as a JavaBean.'],
['request.getParameter("price") returns:',['double','int','String','Object'],2,'getParameter always returns a String (or null).'],
['request.setAttribute("name", name) does:',['Reads form data','Stores data in the request so the JSP can read it','Writes to a database','Redirects'],1,'It puts the value in request scope. Reading form data is getParameter().'],
['Which code forwards to the JSP?',['response.sendRedirect(...)','request.getRequestDispatcher("/example/viewHandbag.jsp").forward(request, response)','request.forward(...)','response.getParameter(...)'],1,'A RequestDispatcher forward keeps the request attributes; sendRedirect starts a new request.'],
['The servlet used setAttribute. Which JSP expression reads it?',['<%= request.setAttribute("brand") %>','<%= request.getAttribute("brand") %>','<c:out value="brand" />','<%= brand.get() %>'],1,'Read with getAttribute. Option 3 would print the word brand; it needs ${brand}.'],
['What does <c:out value="${name}" /> do besides printing?',['Sets an attribute','Escapes special characters (helps avoid XSS)','Reads a form parameter','Declares a variable'],1,'c:out prints the attribute and escapes it.'],
['addHandbag.html is in example/. Why is the action ../HandbagController?',['Servlets must live in a parent folder','../ goes up one level to where the servlet is mapped','Required for POST','It encrypts data'],1,'Relative URLs start from the page’s folder; ../ reaches the app root.'],
['Correct order of steps?',['JSP, servlet, form','Form, servlet processes, forward to JSP','Servlet, form, JSP','Form, JSP, servlet'],1,'Submit the form, controller processes, then forward to the view.'],
['contentType="text/html; charset=UTF-8" ensures:',['Faster rendering','Special characters (é, ü, ñ) display correctly','The JSP becomes a servlet','Security'],1,'UTF-8 encoding makes special characters display correctly.']
]}
,
{id:'j1',t:'June 2025: Part A (MCQ)',s:'The real paper, 10 questions with reasons',q:[
['When should a programmer use a Java interface instead of class inheritance?',['When sharing common code (data members and methods) among related classes','When sharing only common behaviour (method headers) among instances of different classes','When an entity is a strict, specialised form of another entity (an is-a relationship)','When implementing container-managed persistence'],1,'An interface lists method headers that unrelated classes can all promise to provide (for example Taxable on Toy and Book). Sharing code and is-a relationships are what inheritance is for.'],
['Which architecture pattern separates computational code from HTML presentation in Java EE web applications?',['Model-View-Controller (MVC)','Client-Server Architecture','Object-Relational Mapping (ORM)','Abstract Factory Pattern'],0,'MVC separates request processing (controller), business logic (model) and presentation (view, the JSP). Client-server describes who talks to whom; ORM maps objects to database tables.'],
['In MVC applied to JSP, which component typically acts as the Controller?',['The web browser','The JavaBeans object','The servlet','The JSP page'],2,'The servlet receives the request, processes it and forwards to the JSP. The JSP is the View and the JavaBean is the Model.'],
['When the web server receives an HTTP GET request, which Servlet method is executed?',['init()','doPost()','jspService()','doGet()'],3,'HttpServlet.service() dispatches GET requests to doGet() and POST requests to doPost(). init() runs once at start-up; jspService() belongs to JSP pages.'],
['Which JSP predefined variable is the character output stream used to send text to the client?',['request','out','response','pageContext'],1,'out is the PrintWriter-style output stream. request carries input, response is for headers, cookies and content type, and pageContext is a central access point to page attributes.'],
['Which correctly names the three JSP scripting constructs that insert Java code into the servlet?',['Scripts, Variables, Directives','Expressions, Scriptlets, Declarations','Imports, Includes, Taglibs','Models, Views, Controllers'],1,'The three scripting constructs are scriptlet <% %>, expression <%= %> and declaration <%! %>. Directives (page, include, taglib) are separate, and option 4 is MVC.'],
['Why is POST generally considered more secure than GET?',['POST encrypts the query string in the URL','POST requests cannot be intercepted by the web server','POST sends data in the message body, whereas GET exposes data in the URL bar','POST requests are idempotent, so they are ignored if intercepted twice'],2,'POST keeps form data out of the address bar and browser history. It is not encrypted by itself (that needs HTTPS), and GET, not POST, is the idempotent one.'],
['Which tag evaluates a Java expression and inserts it into the servlet output so the current date shows in the browser?',['<% new java.util.Date() %>','<%! new java.util.Date() %>','<%= new java.util.Date() %>','<%@ new java.util.Date() %>'],2,'Only the expression tag <%= %> prints a value. <% %> expects a statement, <%! %> declares fields or methods, and <%@ %> is a directive.'],
['Which servlet life-cycle method is called when the server removes the servlet?',['jspDestroy()','destroy()','doPost()','init()'],1,'destroy() runs once when the servlet is taken out of service. jspDestroy() is the JSP version, and init() runs once at the start.'],
['Which statement retrieves the client’s session but does NOT create a new one if none exists?',['request.getSession();','request.getSession(true);','request.getSession(false);','request.getExistingSession();'],2,'getSession(false) returns null when no session exists. getSession() and getSession(true) create one if needed, and getExistingSession() is not a real method.']
]},
{id:'m2',t:'Midtest Sample 2: Part I (MCQ)',s:'10 questions with reasons',q:[
['How does the code below demonstrate inheritance?',['Tesla class copies all code from Car','Tesla class removes methods from Car','Tesla class reuses Car’s methods','Tesla class overrides the main method of Car'],2,'Tesla extends Car, so a Tesla object can call ignition() even though Tesla never defines it. Inheritance reuses the parent’s methods; it doesn’t copy code, remove methods, and nothing here overrides main (that is in Test).','public class Car {\n  public void ignition() {\n    System.out.println("Car is starting");\n  }\n}\npublic class Tesla extends Car {\n  public void autopilot() {\n    System.out.println("Autopilot engaged");\n  }\n}\npublic class Test {\n  public static void main(String[] args) {\n    Tesla tes = new Tesla();\n    tes.ignition();\n    tes.autopilot();\n  }\n}'],
['Which method call is an example of method overloading?',['display(50) and display("Hello")','display() only','display("text") twice','Overloading is not possible'],0,'Overloading = same method name with different parameter types in one class. Box has display(String) and display(int), and these two calls pick between them. Calling the same version twice isn’t overloading, and Java does allow it.','public class Box {\n  public void display(String s) {\n    System.out.println("String " + s);\n  }\n  public void display(int i) {\n    System.out.println("Number " + i);\n  }\n}'],
['An illustration app: all shapes must define draw(), but all shapes should inherit a common setColor(). What is correct?',['An abstract class with abstract draw() and a concrete setColor()','An interface with both draw() and setColor() as abstract methods','A separate class for each shape, each with its own methods','A static utility class with both methods'],0,'An abstract class can force subclasses to implement draw() (abstract) while giving them a ready-made setColor() to inherit. An interface would force every shape to rewrite setColor() too, and separate classes or a utility class give no shared contract.'],
['Why use MVC with Servlets and JSP in Java EE?',['Combines logic and layout','Improves servlet performance','Separates control, business logic and view','Uses JSP for all layers'],2,'MVC splits request control (servlet), business logic (model) and presentation (JSP). Option A and D describe the opposite: mixing everything in the JSP.'],
['Which statement describes the relationship between Java EE and Java SE?',['Java EE replaces Java SE','Java EE is a GUI framework built on Java SE','Java EE extends Java SE with libraries for web and enterprise development','Java SE is optional for Java EE development'],2,'Java EE (now Jakarta EE) is built on top of Java SE and adds enterprise libraries such as servlets and JSP. It still needs Java SE and isn’t a GUI framework.'],
['Which Java EE component manages the life cycle of servlets and JSPs?',['EJB container','Java compiler','Application context','Web container'],3,'The web container runs servlets and JSPs. The EJB container manages enterprise beans instead.'],
['What is the role of the HttpServletRequest object in a servlet?',['To create new servlets','To send output to the browser','To configure web.xml','To retrieve data from the client request'],3,'The request object carries what the client sent (parameters, headers, attributes). Output goes through the response object.'],
['Which method is used in a servlet to send output (e.g. HTML) to the client?',['request.write()','response.setContentType()','response.getWriter()','request.getOutputStream().write()'],2,'response.getWriter() gives the PrintWriter you write HTML to. setContentType() only declares the type, and the request object has no write methods.'],
['Users log in through a JSP page, then their name must show on several pages. Best place to store it?',['A local variable in each JSP page','A request attribute','A session attribute','A public static variable in a helper class'],2,'A session attribute lasts across requests for that one user. A request attribute disappears after one request, a local variable only exists in one page, and a static variable would be shared by all users.'],
['Which retrieves and displays "username" in JSP?',['<%= request.getParameter("username") %>','<%= request.setParameter("username") %>','<jsp:getProperty name="username" />','<input value="<%= username %>">'],0,'getParameter reads the value from the request and the <%= %> expression prints it. setParameter doesn’t exist, jsp:getProperty needs a bean name and property, and option D uses an undeclared variable.']
]},
{id:'m3',t:'Midtest Sample 3: Part I (MCQ)',s:'14 questions with reasons',q:[
['What is a JavaEE component?',['Special icons for creating user interface elements for thin clients','A data module saved to the component area of the database','A self-contained functional software unit assembled into a JavaEE application that interfaces with other components','A JAR file'],2,'From the slides: a JEE component is a self-contained functional software unit assembled into a JEE application with its related classes and files. It isn’t just a JAR.'],
['What role does JSP play in the MVC architecture?',['Model','View','Controller','None of the above'],1,'JSP produces the presentation, so it is the View. The servlet is the Controller and a JavaBean/class is the Model.'],
['If the data being submitted is sensitive, which method is preferred?',['service','processRequest','doGet','doPost'],3,'doPost handles POST requests, where data goes in the message body instead of the URL. doGet exposes it in the address bar.'],
['Which statement is true about the scope of request in JSP?',['Objects with request scope are accessible from pages processing the same request where they were created','All references are released after the request is processed; if the request is forwarded in the same runtime the object is still reachable','References to objects with request scope are stored in the request object','All of the above'],3,'All three statements describe request scope correctly, which is why forwarding from a servlet to a JSP with setAttribute works.'],
['An HTTP servlet handles client requests through its service() method.',['True','False','Can’t say','None of the above'],0,'HttpServlet.service() receives every request and dispatches it to doGet, doPost and so on.'],
['Which package provides the classes for writing servlets?',['java.io','java.lang','javax','java.awt'],2,'Servlet classes are in javax.servlet (jakarta.servlet on Tomcat 10 and later). java.io, java.lang and java.awt are unrelated.'],
['What is <%@ page isErrorPage="true" %> used for?',['Print error','Print output','Get input','None of the above'],0,'It marks the page as an error page, whose job is to display error information. It doesn’t read input or print normal output.','<%@ page isErrorPage="true" %>'],
['To show money format on a JSP page we use which class?',['AirthmaticFormat','CurrencyFormat','StringBuffer','NumberFormat'],3,'java.text.NumberFormat (for example getCurrencyInstance()) formats money. AirthmaticFormat and CurrencyFormat aren’t standard classes, and StringBuffer only builds strings.'],
['The accessor method for a Boolean property visible should be:',['public boolean isVisible()','public boolean getVisible()','public bool isVisible()','private boolean getVisible()'],0,'The JavaBean convention for a boolean getter is isXxx(). The method must be public, and Java’s type is boolean (there is no bool).'],
['Which is true of a bean?',['A bean cannot have any constructors with parameters','A bean must be a private class','A bean must have a public no-argument constructor','All of the above'],2,'Option C is meant to read "public no-argument constructor" (the paper’s wording is garbled). A bean may have other constructors as long as that one exists, and the class must be public, not private.'],
['What is the sequence of the servlet life cycle? 1. init() 2. destroy() 3. service()',['1,3,2','1,2,3','3,1,2','2,1,3'],0,'init() runs once, service() runs for every request, then destroy() runs once at the end.'],
['All the ____ data is kept at the application server, ____ data is kept at the web server.',['HTML, Servlet','static, dynamic','dynamic, static','Servlet, HTML'],2,'Dynamic content (servlets, JSP) is produced by the application/servlet server, while static files such as HTML are served by the web server.'],
['Which call causes unpredictable results in a servlet? (the paper writes System.out(0), meant as System.exit(0))',['System.out(0);','doGet()','System.out.println','doPost()'],0,'System.exit(0) would shut down the whole JVM, which stops the server and every application on it. doGet, doPost and println are normal servlet code.'],
['How do you include a static file in a JSP page?',['<%= include %>','<%@ page import %>','<jsp:directive> or <%@ include %>','<%@ page contentType %>'],2,'The include directive inserts a file when the page is translated. page import brings in Java classes and contentType sets the response type.']
]},
{id:'p1',t:'Oct 2025 past year: Part I (MCQ)',s:'The real paper, 10 questions with reasons',q:[
['Which is the correct way of implementing an interface ServiceTax by class Bill?',['class Bill extends ServiceTax {}','class Bill implement ServiceTax {}','class Bill implements ServiceTax {}','class Bill imports ServiceTax {}'],2,'A class uses the keyword implements for an interface. extends is for a parent class; implement and imports aren’t Java keywords for this.'],
['Which of the following is TRUE?',['A child class can extend just one parent and can implement just one interface','A child class can extend a parent or implement an interface, but not both','A child class can extend zero or more parents, and implement zero or more interfaces','A child class can extend just one parent and can implement zero or more interfaces'],3,'Java has single inheritance (one parent) but a class may implement any number of interfaces, including none.'],
['Defining a method in a subclass with the same name and signature as one in its superclass is:',['Method hiding','Method overloading','Method overriding','None of the above'],2,'Same name and signature in child and parent = overriding. Overloading is the same name with different parameters.'],
['Which are TRUE for J2EE components? (i) Client-tier runs on the client machine (ii) Web tier runs on the J2EE server (iii) Business tier runs on the J2EE server (iv) EIS software runs on the J2EE server',['i and ii','i, ii and iii','i, iii and iv','i, ii and iv'],1,'Client tier runs on the client; web and business tiers run on the server. EIS (e.g. database/legacy systems) is a separate tier, so (iv) is false.'],
['Which is TRUE regarding a JEE application server?',['It provides standard JEE services','It does not serve application data to clients','It is a server application that implements the JEE platform APIs','It hosts several component types that correspond to the tiers in a multi-tiered application'],3,'The official key is D. B is clearly false (it does serve data). A and C paraphrase the notes too, so read the wording carefully: D is the most complete statement.'],
['Which package contains the servlet classes and interfaces (Tomcat 10 / Jakarta)?',['java.servlet.*','org.java.servlet.*','jakarta.servlet.http.*','jakarta.servlet.web.*'],2,'Servlet classes live in jakarta.servlet (and jakarta.servlet.http for HTTP ones). The other packages don’t exist.'],
['With parameters request and response, to set the content type to the client you invoke:',['request.setContentType("html")','request.setContentType("text/html")','response.setContentsType("text/html")','response.setContentType("text/html")'],3,'The content type is set on the response, the method is setContentType, and the value is "text/html".'],
['Which is NOT a valid JSP construct?',['Expression','Declaration','Directive','Scriptlet'],2,'The three scripting constructs are scriptlet, expression and declaration. A directive (<%@ ... %>) is a separate thing.'],
['home.jsp?name=Brian with: <% String name=request.getParameter(); %> <% String hi = "Annyeong " + name; %> <%= hi %>. What happens?',['Prints "Annyeong Brian"','Syntax error because of <%= hi %>','Syntax error because of <% String name=request.getParameter(); %>','Syntax error because of <% String hi= "Annyeong " + name; %>'],2,'getParameter() needs the parameter name as an argument, e.g. getParameter("name"). Without it the code doesn’t compile.'],
['Which is legal JSP syntax to print the value of p?',['<%int p = 200;%> <%= p; %>','<%int p = 200%> <%= p %>','<%int p = 200;%> <%= p %>','<%int p = 200; p; %>'],2,'A scriptlet statement ends with a semicolon; an expression <%= p %> must NOT have one. Option 4 isn’t a valid statement.']
]},
{id:'p2',t:'Exam-style practice: Part I (new MCQ)',s:'12 new questions in the same style',q:[
['Gift should extend Goods and implement Taxable and Giftable. Which is correct?',['class Gift extends Goods implements Taxable, Giftable {}','class Gift implements Goods extends Taxable, Giftable {}','class Gift extends Goods, Taxable implements Giftable {}','class Gift extends Goods implements Taxable extends Giftable {}'],0,'One parent with extends first, then implements with a comma-separated list of interfaces.'],
['Which is TRUE about an abstract class?',['It can be instantiated','It can contain both abstract and concrete methods','All its methods must be abstract','It cannot have a constructor'],1,'Abstract classes may mix abstract and concrete methods and have constructors (run via super()). They just can’t be instantiated.'],
['Two methods in the SAME class share a name but differ in parameters. This is:',['Overriding','Overloading','Shadowing','Polymorphism'],1,'Overloading = same class, same name, different parameters. Overriding needs a parent and a child.'],
['Dog extends Animal. Animal a = new Dog(); Which is TRUE?',['a instanceof Dog is false','a instanceof Dog is true','a instanceof Animal is false','Compile error'],1,'instanceof checks the real object: it is a Dog, and a Dog is also an Animal, so both Dog and Animal tests are true.'],
['Which are TRUE for Java EE components? (i) Applets run on the client (ii) Servlets run on the JEE server (iii) Enterprise beans run on the JEE server (iv) Application clients run on the server',['i and ii','i, ii and iii','i, iii and iv','i, ii, iii and iv'],1,'Application clients run on the client machine, not the server, so (iv) is false.'],
['Which container manages the execution of servlets and JSPs?',['Web container','Enterprise bean container','Applet container','Application client container'],0,'The web container runs web pages and servlets; the EJB container runs enterprise beans.'],
['Which JSP tag declares a method in the generated servlet?',['<% %>','<%= %>','<%! %>','<%@ %>'],2,'Declarations use <%! ... %>. <% %> is a scriptlet, <%= %> an expression and <%@ %> a directive.'],
['Which is legal JSP syntax to print total?',['<% double total = 99.5; %> <%= total %>','<% double total = 99.5 %> <%= total %>','<% double total = 99.5; %> <%= total; %>','<%= double total = 99.5; %>'],0,'The scriptlet statement needs ; and the expression must not have one. Option 4 puts a statement inside an expression.'],
['home.jsp?user=Ali with <% String user = request.getParameter("user"); %> Hello <%= user %> prints:',['Hello user','Hello Ali','Hello null','Syntax error'],1,'getParameter("user") returns the value Ali, and the expression prints it.'],
['To send HTML output from a servlet you first need a PrintWriter. Which gets it?',['request.getWriter()','response.getWriter()','response.getOutput()','out.getWriter()'],1,'The writer belongs to the response. Requests carry input, responses carry output.'],
['A form contains a password field. Which method should it use?',['GET','POST','Either, no difference','HEAD'],1,'POST keeps data out of the URL and has no size limit. GET exposes data in the address bar.'],
['Which import is correct for @WebServlet on Tomcat 10?',['import javax.servlet.annotation.WebServlet;','import jakarta.servlet.annotation.WebServlet;','import jakarta.annotation.servlet.WebServlet;','import java.servlet.annotation.WebServlet;'],1,'Only the root changes from javax to jakarta; the rest of the path is unchanged.']
]}
];

{k:'fill',t:'Fill the blanks: Book class',code:'class Book [[0]] Goods [[1]] Taxable {\n  String [[2]];\n  Book(String des, double pr, String auth) {\n    super(des, pr);\n    [[3]] = auth;\n  }\n  void display() {\n    super.display();\n    System.out.println("author: " + [[4]]);\n  }\n  public double [[5]]() {\n    return price * [[6]];\n  }\n}',ans:['extends','implements','author','author|this.author','author|this.author','calculateTax','taxRate'],note:'Goods is a class (extends), Taxable an interface (implements). The method must match the interface’s calculateTax(), and taxRate is the interface constant.'},
{k:'fill',t:'Fill the blanks: servlet doPost',code:'protected void doPost(HttpServletRequest request, HttpServletResponse response)\n    throws ServletException, IOException {\n  String name = request.[[0]]("name");\n  request.[[1]]("name", name);\n  RequestDispatcher d = request.[[2]]("/example/viewHandbag.jsp");\n  d.[[3]](request, response);\n}',ans:['getParameter','setAttribute','getRequestDispatcher','forward'],note:'Read with getParameter, store with setAttribute, get a dispatcher, then forward.'},
{k:'fill',t:'Fill the blank: Tomcat 10 import',code:'import [[0]].servlet.http.HttpServlet;',ans:['jakarta'],note:'Tomcat 10+ uses jakarta.*; Tomcat 9 and earlier use javax.*.'},
{k:'fill',t:'Fill the blanks: servlet output and session',code:'response.[[0]]("text/html");\nPrintWriter out = response.[[1]]();\nHttpSession session = request.[[2]](true);',ans:['setContentType','getWriter','getSession'],note:'setContentType makes the browser render HTML; getWriter gives the PrintWriter; getSession(true) gets or creates the session.'},
{k:'fill',t:'Fill the blanks: JSTL loop',code:'<%@ taglib prefix="[[0]]" uri="http://java.sun.com/jsp/jstl/core" %>\n<c:[[1]] var="i" begin="1" end="5">\n  Item <c:[[2]] value="${i}"/><br/>\n</c:[[1]]>',ans:['c','forEach','out'],note:'The prefix is c, the loop tag is forEach, and out prints the value.'},
{k:'write',t:'Write it: Card, Birthday, Holiday + main',prompt:'Write abstract class Card (recipient, abstract greeting()), subclasses Birthday and Holiday, and a main that uses one Card variable for both.',model:'abstract class Card {\n  String recipient;\n  public abstract void greeting();\n}\nclass Holiday extends Card {\n  Holiday(String r) { recipient = r; }\n  public void greeting() {\n    System.out.println("Dear " + recipient + ",");\n    System.out.println("Season’s Greetings!");\n  }\n}\n// Birthday is the same idea with its own message\npublic static void main(String[] args) {\n  Card card = new Holiday("Amy");\n  card.greeting();\n  card = new Birthday("Cindy");\n  card.greeting();\n}',check:['Card is declared abstract','greeting() is abstract: no body, ends with ;','Subclasses use extends Card','Each subclass implements greeting() with its own message','main uses a Card variable and reassigns it (polymorphism)']},
{k:'write',t:'Write it: HandbagController doPost',prompt:'Write doPost that reads name and brand, stores them as request attributes and forwards to /example/viewHandbag.jsp.',model:'protected void doPost(HttpServletRequest request, HttpServletResponse response)\n    throws ServletException, IOException {\n  String name = request.getParameter("name");\n  String brand = request.getParameter("brand");\n  request.setAttribute("name", name);\n  request.setAttribute("brand", brand);\n  RequestDispatcher d = request.getRequestDispatcher("/example/viewHandbag.jsp");\n  d.forward(request, response);\n}',check:['Signature is doPost(HttpServletRequest, HttpServletResponse) with throws','getParameter for each form field','setAttribute for each value','getRequestDispatcher then forward(request, response)','Imports use jakarta.servlet on Tomcat 10']},
{k:'write',t:'Write it: a simple HTML form',prompt:'Write a form that POSTs to /register with text field name, an email field, radio buttons for gender (name gender), a select for course and a submit button.',model:'<form action="/register" method="post">\n  Name: <input type="text" name="name"><br>\n  Email: <input type="email" name="email"><br>\n  <input type="radio" name="gender" value="male" checked> Male\n  <input type="radio" name="gender" value="female"> Female<br>\n  <select name="course">\n    <option value="csc584">CSC584</option>\n    <option value="csc583">CSC583</option>\n  </select><br>\n  <input type="submit" value="Submit">\n</form>',check:['form has action and method="post"','every input has a name','radio buttons share the same name','select contains option elements with value','submit button present']}
];

const PART2=[
{k:'trace',t:'Q1 (past year): predict the output',tree:'Product\n├─ Meat\n│   ├─ Beef\n│   └─ Poultry\n│       └─ Chicken\n└─ Dairy\n    ├─ Milk\n    └─ Cheese\n        ├─ Cheddar\n        │   ├─ Mild\n        │   └─ Aged\n        └─ Mozzarella',code:'Product p = new Milk();\nDairy d = new Mozzarella();\nMeat m = new Chicken();\np = new Aged();\nm = new Beef();',lines:['p instanceof Cheddar','m instanceof Poultry','d instanceof Dairy'],ans:[true,false,true],note:'Use the LAST object assigned. p is Aged, and Aged extends Cheddar: true. m is Beef, a sibling of Poultry, not a Poultry: false. d is Mozzarella, under Cheese under Dairy: true.'},
{k:'trace',t:'Q1 (new): vehicles',tree:'Vehicle\n├─ Land\n│   ├─ Car\n│   │   └─ SportCar\n│   └─ Bike\n└─ Water\n    ├─ Boat\n    └─ Ship\n        └─ Ferry',code:'Vehicle v = new Boat();\nLand l = new Car();\nWater w = new Ferry();\nv = new SportCar();\nl = new Bike();',lines:['v instanceof Car','l instanceof Car','w instanceof Ship','v instanceof Water'],ans:[true,false,true,false],note:'Track the latest object. v ends as SportCar: it is a Car (true) but not Water (false). l is Bike, a sibling of Car: false. w is Ferry, which extends Ship: true.'},
{k:'trace',t:'Q1 (new): goods and interface',tree:'Goods\n├─ Food\n├─ Toy   (implements Taxable)\n└─ Book  (implements Taxable)',code:'Goods g = new Book();\nGoods f = new Food();\nGoods t = new Toy();',lines:['g instanceof Taxable','f instanceof Taxable','t instanceof Goods'],ans:[true,false,true],note:'instanceof also works with interfaces. Book implements Taxable: true. Food does not: false. Toy extends Goods: true.'},
{k:'write',t:'Q2 (past year): JSP rental cost',prompt:'form.html sends days and hours. Write calculate.jsp using JSP constructs: rate RM120 per day and RM15 per extra hour. Output: “You need to pay RM 1110.00 for renting the car for 3 days and 2 hours”. (Note: the formula in the paper’s model answer gives RM 390.00 for 3 days and 2 hours, so the 1110.00 in the figure doesn’t match. In the exam, follow the formula you are given.)',model:'<%\n  int days = Integer.parseInt(request.getParameter("days"));\n  int hours = Integer.parseInt(request.getParameter("hours"));\n  double totalCost = (120 * days) + (15 * hours);\n%>\nYou need to pay RM <b><%= String.format("%.2f", totalCost) %></b><br>\nfor renting the car for <b><%= days %></b> days and <b><%= hours %></b> hours',check:['Scriptlet <% %> retrieves days with getParameter("days")','Converts to int with Integer.parseInt (getParameter returns a String)','Same for hours','totalCost = (120 * days) + (15 * hours)','Displays with expressions <%= %> (no semicolon)','Formats the cost to 2 decimal places']},
{k:'write',t:'Q2 (new): JSP parking fee',prompt:'form.html sends hours (number) and type (Car or Motorcycle). Car costs RM3 per hour, Motorcycle RM1.50 per hour. Write parking.jsp to show: “Parking fee for Car for 5 hour(s): RM 15.00”.',model:'<%\n  int hours = Integer.parseInt(request.getParameter("hours"));\n  String type = request.getParameter("type");\n  double rate = type.equals("Car") ? 3.0 : 1.5;\n  double fee = rate * hours;\n%>\nParking fee for <b><%= type %></b> for <b><%= hours %></b> hour(s):\nRM <b><%= String.format("%.2f", fee) %></b>',check:['Retrieves hours and type with getParameter','Parses hours to int','Chooses the rate from the type (if/else or ternary, using equals)','Computes fee = rate * hours','Prints with <%= %> expressions','Formats the fee to 2 decimals']},
{k:'write',t:'Q2 (new): JSP discount with if',prompt:'form.html sends price (decimal) and quantity (integer). If the total is above RM500 give a 10% discount. Write total.jsp showing the total payable to 2 decimal places.',model:'<%\n  double price = Double.parseDouble(request.getParameter("price"));\n  int qty = Integer.parseInt(request.getParameter("quantity"));\n  double total = price * qty;\n  if (total > 500) {\n    total = total * 0.90;\n  }\n%>\nTotal payable: RM <%= String.format("%.2f", total) %>',check:['Double.parseDouble for price, Integer.parseInt for quantity','total = price * qty','if (total > 500) applies the 10% discount','Result printed with <%= %>','Formatted to 2 decimals']},
{k:'write',t:'Q3 (past year): Travel Budget Calculator servlet',prompt:'Form fields: months, saved, destination (Local RM2000, Asia RM5000, Others RM15000). Complete doPost: (i) retrieve input (ii) target cost by destination (iii) monthly savings = (target - saved) / months (iv) display like: Destination: Local, Target Travel Fund: RM 2000.00, Current Savings: RM 1500.00, Months to Save: 5, “You need to save RM 100.00 per month to reach your goal”.',model:'protected void doPost(HttpServletRequest request, HttpServletResponse response)\n    throws ServletException, IOException {\n  int months = Integer.parseInt(request.getParameter("months"));\n  double saved = Double.parseDouble(request.getParameter("saved"));\n  String dest = request.getParameter("destination");\n  double target;\n  if (dest.equals("Local")) target = 2000;\n  else if (dest.equals("Asia")) target = 5000;\n  else target = 15000;\n  double monthly = (target - saved) / months;\n  response.setContentType("text/html");\n  PrintWriter out = response.getWriter();\n  out.println("<h2>Travel Budget Calculator</h2>");\n  out.println("Destination: " + dest + "<br>");\n  out.println("Target Travel Fund: RM " + String.format("%.2f", target) + "<br>");\n  out.println("Current Savings: RM " + String.format("%.2f", saved) + "<br>");\n  out.println("Months to Save: " + months + "<br>");\n  out.println("You need to save RM " + String.format("%.2f", monthly) + " per month to reach your goal");\n}',check:['Retrieves all three inputs with getParameter and converts numbers (parseInt / parseDouble)','Chooses the target cost from the destination (if/else or switch, using equals)','monthly = (target - saved) / months','setContentType("text/html") and getWriter()','Prints every line of the sample output','Formats money to 2 decimals']},
{k:'write',t:'Q3 (new): gym membership servlet',prompt:'Form fields: name, plan (Basic RM50, Standard RM80, Premium RM120 per month), months. Total = plan price x months. If months is 12 or more, give 10% discount. Complete doPost and display name, plan, months and the total to 2 decimals.',model:'protected void doPost(HttpServletRequest request, HttpServletResponse response)\n    throws ServletException, IOException {\n  String name = request.getParameter("name");\n  String plan = request.getParameter("plan");\n  int months = Integer.parseInt(request.getParameter("months"));\n  double price;\n  if (plan.equals("Basic")) price = 50;\n  else if (plan.equals("Standard")) price = 80;\n  else price = 120;\n  double total = price * months;\n  if (months >= 12) total = total * 0.90;\n  response.setContentType("text/html");\n  PrintWriter out = response.getWriter();\n  out.println("<h2>Gym Membership</h2>");\n  out.println("Name: " + name + "<br>");\n  out.println("Plan: " + plan + "<br>");\n  out.println("Months: " + months + "<br>");\n  out.println("Total: RM " + String.format("%.2f", total));\n}',check:['Retrieves name, plan, months and parses months to int','Plan price chosen with if/else or switch','total = price * months','10% discount when months >= 12','setContentType and getWriter used for output','Total formatted to 2 decimals']},
{k:'write',t:'Q3 (new): servlet + JSP (MVC)',prompt:'A form sends marks (0-100). Write the servlet doPost that decides the grade (A for 80+, B for 60-79, otherwise C), stores marks and grade as request attributes and forwards to result.jsp. Then write the JSTL lines in result.jsp to display them.',model:'protected void doPost(HttpServletRequest request, HttpServletResponse response)\n    throws ServletException, IOException {\n  int marks = Integer.parseInt(request.getParameter("marks"));\n  String grade;\n  if (marks >= 80) grade = "A";\n  else if (marks >= 60) grade = "B";\n  else grade = "C";\n  request.setAttribute("marks", marks);\n  request.setAttribute("grade", grade);\n  RequestDispatcher d = request.getRequestDispatcher("/result.jsp");\n  d.forward(request, response);\n}\n\n<!-- result.jsp -->\n<%@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>\n<p>Marks: <c:out value="${marks}" /></p>\n<p>Grade: <c:out value="${grade}" /></p>',check:['Reads marks with getParameter and parses to int','Grade decided with if / else if / else','setAttribute for marks and grade','getRequestDispatcher(...).forward(request, response)','JSP declares the taglib with prefix c','JSP prints with c:out and ${marks} / ${grade}']}
];

{k:'write',t:'Q1(a): abstract class Account and two subclasses (6 marks)',prompt:'Write an abstract class Account with a String accountHolder. (i) Define a normal constructor that accepts accountHolder and assigns it to the class variable. (ii) Declare an abstract method printDetails(). (iii) Create SavingsAccount and CurrentAccount that both extend Account. Each must override printDetails() to display the account holder’s name and the specific type of account.',model:'abstract class Account {\n  String accountHolder;\n\n  public Account(String accountHolder) {\n    this.accountHolder = accountHolder;\n  }\n\n  public abstract void printDetails();\n}\n\nclass SavingsAccount extends Account {\n  public SavingsAccount(String accountHolder) {\n    super(accountHolder);\n  }\n  public void printDetails() {\n    System.out.println("Account holder: " + accountHolder);\n    System.out.println("Account type: Savings Account");\n  }\n}\n\nclass CurrentAccount extends Account {\n  public CurrentAccount(String accountHolder) {\n    super(accountHolder);\n  }\n  public void printDetails() {\n    System.out.println("Account holder: " + accountHolder);\n    System.out.println("Account type: Current Account");\n  }\n}',check:['Account is declared abstract','Constructor accepts a String and assigns it with this.accountHolder = accountHolder','printDetails() is abstract: no body, ends with ;','Both subclasses use extends Account and call super(accountHolder)','Both override printDetails() and print the holder name AND their own account type']},
{k:'write',t:'Q1(b): main method with an array of accounts (4 marks)',prompt:'Write a main method that (i) declares an array of Account objects with at least 3 different accounts, each with a different account holder’s name, and (ii) iterates through the array and invokes printDetails() for each.',model:'public static void main(String[] args) {\n  Account[] accounts = new Account[3];\n  accounts[0] = new SavingsAccount("Aisha");\n  accounts[1] = new CurrentAccount("Daniel");\n  accounts[2] = new SavingsAccount("Mei Ling");\n\n  for (int i = 0; i < accounts.length; i++) {\n    accounts[i].printDetails();\n  }\n}',check:['Array declared with the parent type: Account[]','At least 3 objects created with new, each with a different name','Mixes SavingsAccount and CurrentAccount (polymorphism)','Loop goes through every element','printDetails() is called on each element']},
{k:'write',t:'Q2(a): calculateTotalCost() in RoomBooking (2.5 marks)',figs:[F(OT('',['<table><tr><th>Room Type</th><th>Price Per Night</th></tr><tr><td>Standard</td><td>RM200</td></tr><tr><td>Deluxe</td><td>RM350</td></tr><tr><td>Suite</td><td>RM500</td></tr></table>']),'Room price table')],prompt:'RoomBooking has public data members bookingId, guestName, roomType (String) and nights (int), plus a constructor. Complete the method calculateTotalCost() so it returns the total cost based on the room type and number of nights.',model:'public double calculateTotalCost() {\n  double price;\n  if (roomType.equals("Standard")) {\n    price = 200;\n  } else if (roomType.equals("Deluxe")) {\n    price = 350;\n  } else {\n    price = 500;   // Suite\n  }\n  return price * nights;\n}',check:['Return type is a number (double or int) and the method returns a value','Compares Strings with equals(), not ==','Standard 200, Deluxe 350, Suite 500','Multiplies the price by nights']},
{k:'write',t:'Q2(b): BookingServlet doPost (9 marks)',figs:[F(FM([['Booking ID:',''],['Guest Name:',''],['Room Type:','Standard',1],['Number of Nights:','']],'Book Room'),'bookingForm.html (drawn from the given code)')],prompt:'bookingForm.html POSTs bookingId, guestName, roomType and nights to BookingServlet. Write doPost to: (i) retrieve the values (4 marks), (ii) create a RoomBooking object (2 marks), (iii) store the object in the request scope (1 mark), (iv) forward the request and response to bookingResult.jsp (2 marks).',model:'protected void doPost(HttpServletRequest request, HttpServletResponse response)\n    throws ServletException, IOException {\n  response.setContentType("text/html;charset=UTF-8");\n\n  // i) retrieve input values (4m)\n  int bookingId = Integer.parseInt(request.getParameter("bookingId"));\n  String guestName = request.getParameter("guestName");\n  String roomType = request.getParameter("roomType");\n  int nights = Integer.parseInt(request.getParameter("nights"));\n\n  // ii) create object (2m)\n  RoomBooking booking = new RoomBooking(bookingId, guestName, roomType, nights);\n\n  // iii) store the object in the request scope (1m)\n  request.setAttribute("booking", booking);\n\n  // iv) forward to jsp (2m)\n  RequestDispatcher rd = request.getRequestDispatcher("bookingResult.jsp");\n  rd.forward(request, response);\n}',check:['(i) All four getParameter calls use the exact field names from the form (4m)','(i) bookingId and nights converted with Integer.parseInt (getParameter returns a String)','(ii) new RoomBooking(...) with the arguments in constructor order (2m)','(iii) request.setAttribute("booking", booking) (1m)','(iv) getRequestDispatcher("bookingResult.jsp") then forward(request, response) (2m)']},
{k:'write',t:'Q2(c): bookingResult.jsp (8.5 marks)',figs:[F('<pre style="text-align:left;margin:0">//i) import java class (1.5m)\n\n//ii) retrieve student object from servlet (2m)\n\n&lt;html&gt;\n&lt;head&gt;&lt;title&gt;Booking Details&lt;/title&gt;&lt;/head&gt;\n&lt;body&gt;\n\n//iii) display the room booking information (5m)\n\n&lt;/body&gt;\n&lt;/html&gt;</pre>','The answer template given in the paper')],prompt:'Write the JSP that (i) imports the Java class (1.5 marks), (ii) retrieves the object from the request (2 marks) and (iii) displays the booking details (5 marks). The paper does not show the expected output picture, so show every field plus the total cost.',model:'<%@ page import="model.RoomBooking" %>   <%-- use your own package name --%>\n<%\n  RoomBooking booking = (RoomBooking) request.getAttribute("booking");\n%>\n<html>\n<head><title>Booking Details</title></head>\n<body>\n  <h2>Booking Details</h2>\n  <p>Booking ID: <%= booking.bookingId %></p>\n  <p>Guest Name: <%= booking.guestName %></p>\n  <p>Room Type: <%= booking.roomType %></p>\n  <p>Number of Nights: <%= booking.nights %></p>\n  <p>Total Cost: RM <%= String.format("%.2f", booking.calculateTotalCost()) %></p>\n</body>\n</html>',check:['(i) Page directive with the import attribute: <%@ page import="..." %> (1.5m)','(ii) request.getAttribute("booking") with the same name used in the servlet (2m)','(ii) Cast to RoomBooking, because getAttribute returns Object','(iii) Booking ID, guest name, room type and nights shown with <%= %> expressions (5m)','(iii) Total cost shown by calling calculateTotalCost()']}
];

const MID2=[
{k:'write',t:'Q1(a): abstract class ShapeDraw and two subclasses (6 marks)',prompt:'Write an abstract class ShapeDraw with a String color. (i) Define a normal constructor that accepts a String color and assigns it to the class variable. (ii) Declare an abstract method draw(). (iii) Create subclasses Triangle and Rectangle that both extend ShapeDraw. Each must override draw() to print the shape name and its color.',model:'abstract class ShapeDraw {\n  String color;\n\n  public ShapeDraw(String color) {\n    this.color = color;\n  }\n\n  public abstract void draw();\n}\n\nclass Triangle extends ShapeDraw {\n  public Triangle(String color) {\n    super(color);\n  }\n  public void draw() {\n    System.out.println("Shape: Triangle, color: " + color);\n  }\n}\n\nclass Rectangle extends ShapeDraw {\n  public Rectangle(String color) {\n    super(color);\n  }\n  public void draw() {\n    System.out.println("Shape: Rectangle, color: " + color);\n  }\n}',check:['ShapeDraw is declared abstract','Constructor accepts a String and assigns this.color = color','draw() is abstract: no body, ends with ;','Triangle and Rectangle use extends ShapeDraw and call super(color)','Both override draw() and print the shape name AND the color']},
{k:'write',t:'Q1(b): main with an array of shapes (4 marks)',prompt:'Write a main method that (i) declares an array of shape objects (the paper says Shape; your class is ShapeDraw) containing at least 3 different shapes, each with a different color, and (ii) iterates over the array and displays the color of each shape.',model:'public static void main(String[] args) {\n  ShapeDraw[] shapes = new ShapeDraw[3];\n  shapes[0] = new Triangle("Red");\n  shapes[1] = new Rectangle("Blue");\n  shapes[2] = new Triangle("Green");\n\n  for (int i = 0; i < shapes.length; i++) {\n    System.out.println("Color: " + shapes[i].color);\n    // shapes[i].draw(); also prints the color\n  }\n}',check:['Array declared with the parent type (ShapeDraw[])','At least 3 objects created, each with a different color','Mixes Triangle and Rectangle (polymorphism)','Loop visits every element','The color of each shape is displayed']},
{k:'write',t:'Q2(a): calculateConvoFee() in Student (2.5 marks)',figs:[F(OT('',['<table><tr><th>Level of study</th><th>Fee</th></tr><tr><td>Diploma</td><td>RM300</td></tr><tr><td>Degree</td><td>RM350</td></tr><tr><td>Master</td><td>RM400</td></tr><tr><td>PhD</td><td>RM450</td></tr></table>']),'Fee table'),F(PRE('public class Student {\n  public int studentID;\n  public String name;\n  public String level;\n  public double cgpa;\n\n  public Student(int studentID, String name,\n                 String level, double cgpa) {\n    this.studentID = studentID;\n    this.name = name;\n    this.level = level;\n    this.cgpa = cgpa;\n  }\n\n  //i) method calculateConvoFee()  (2.5m)\n}'),'The Student class given in the paper')],prompt:'Complete calculateConvoFee() so it returns the fee for the student’s level. Careful: the fee table says Degree and Master, but the form’s drop-down options are Diploma, Ijazah Sarjana Muda, Sarjana and PhD. Compare against the strings the form actually sends.',model:'public double calculateConvoFee() {\n  double fee;\n  if (level.equals("Diploma")) {\n    fee = 300;\n  } else if (level.equals("Ijazah Sarjana Muda")) {   // Degree\n    fee = 350;\n  } else if (level.equals("Sarjana")) {               // Master\n    fee = 400;\n  } else {                                            // PhD\n    fee = 450;\n  }\n  return fee;\n}',check:['Returns a number (double or int) from the method','Compares Strings with equals(), not ==','Diploma 300, Degree 350, Master 400, PhD 450','The strings compared match what the form sends (Ijazah Sarjana Muda, Sarjana)']},
{k:'write',t:'Q2(b): ConvocationServlet doPost (9 marks)',figs:[F(FH('Student Registration Form',[['Student ID:',''],['Name:',''],['Level of Study:','Diploma',1],['CGPA:','']],'Register'),'convocationForm.html (drawn from the given code; fields studentId, name, level, cgpa)')],prompt:'The form POSTs studentId, name, level and cgpa to ConvocationServlet. Write doPost to: (a) retrieve the values, (b) create a Student object, (c) store the object in the request scope, and (d) forward to convocationResult.jsp.',model:'protected void doPost(HttpServletRequest request, HttpServletResponse response)\n    throws ServletException, IOException {\n  response.setContentType("text/html;charset=UTF-8");\n\n  // a) retrieve the values (note the form field is studentId)\n  int studentID = Integer.parseInt(request.getParameter("studentId"));\n  String name = request.getParameter("name");\n  String level = request.getParameter("level");\n  double cgpa = Double.parseDouble(request.getParameter("cgpa"));\n\n  // b) create object\n  Student student = new Student(studentID, name, level, cgpa);\n\n  // c) store in the request scope\n  request.setAttribute("student", student);\n\n  // d) forward\n  RequestDispatcher rd = request.getRequestDispatcher("convocationResult.jsp");\n  rd.forward(request, response);\n}',check:['All four getParameter calls use the exact form names: studentId, name, level, cgpa','studentId parsed with Integer.parseInt and cgpa with Double.parseDouble','new Student(...) with arguments in constructor order (studentID, name, level, cgpa)','request.setAttribute("student", student)','getRequestDispatcher("convocationResult.jsp") then forward(request, response)']},
{k:'write',t:'Q2(c): convocationResult.jsp (8.5 marks)',figs:[F(OT('Convocation Registration',['Student ID: xxx xxx','Name: xxx xxx','Level of Study: xxxx xxxx','CGPA: xxxx xxxx','Convocation Fee: xxxx xxxx']),'Required output')],prompt:'Write the JSP that retrieves the Student object from the request and displays the convocation registration as shown.',model:'<%@ page import="model.Student" %>   <%-- use your own package name --%>\n<%\n  Student student = (Student) request.getAttribute("student");\n%>\n<html>\n<head><title>Convocation Registration</title></head>\n<body>\n  <h2>Convocation Registration</h2>\n  <p>Student ID: <%= student.studentID %></p>\n  <p>Name: <%= student.name %></p>\n  <p>Level of Study: <%= student.level %></p>\n  <p>CGPA: <%= student.cgpa %></p>\n  <p>Convocation Fee: RM <%= String.format("%.2f", student.calculateConvoFee()) %></p>\n</body>\n</html>',check:['Page directive imports the Student class','request.getAttribute("student") with the same name used in the servlet, cast to Student','Student ID, name, level and CGPA shown with <%= %> expressions','Convocation fee shown by calling calculateConvoFee()','Layout and labels match the required output']}
];
const MID3=[
{k:'write',t:'Q1: deployment descriptor (4 marks)',prompt:'Write a deployment descriptor (web.xml) to map a servlet. Servlet name: DisplayAccountInfo. URL pattern: account.info. (The paper doesn’t give the servlet class, so use the same name.)',model:'<web-app>\n  <servlet>\n    <servlet-name>DisplayAccountInfo</servlet-name>\n    <servlet-class>DisplayAccountInfo</servlet-class>\n  </servlet>\n  <servlet-mapping>\n    <servlet-name>DisplayAccountInfo</servlet-name>\n    <url-pattern>/account.info</url-pattern>\n  </servlet-mapping>\n</web-app>',check:['<web-app> is the outer element','<servlet> contains <servlet-name> and <servlet-class>','<servlet-mapping> contains <servlet-name> and <url-pattern>','The servlet-name is identical in both places (it links them)','url-pattern is account.info (modern Tomcat needs the leading slash: /account.info)']},
{k:'write',t:'Q2: JavaBean tags for AccountBean (5 marks)',figs:[F(PRE('import java.text.*;\npublic class AccountBean {\n  private String total;\n\n  public void setTotal(String total) {\n    this.total = total;\n  }\n  public String getTotal() {\n    return total;\n  }\n}'),'AccountBean given in the paper')],prompt:'(a) Create an instance of AccountBean and associate it with the id converter, to be used in the entire JSP, with page as the scope. (b) Retrieve the converter’s property using the standard get tag. (c) Set the converter’s property using the standard set tag. (These tags are not in the slides I read; see the JavaBeans note in Chapter 4.)',model:'<%-- a) create the bean --%>\n<jsp:useBean id="converter" class="AccountBean" scope="page" />\n\n<%-- b) get the property --%>\n<jsp:getProperty name="converter" property="total" />\n\n<%-- c) set the property --%>\n<jsp:setProperty name="converter" property="total" value="100.00" />',check:['(a) jsp:useBean has id="converter", class="AccountBean" and scope="page"','(b) jsp:getProperty has name="converter" (the id) and property="total"','(c) jsp:setProperty has name="converter", property="total" and a value','The property name is total (matches getTotal / setTotal), written lowercase']},
{k:'write',t:'Part III: computePayment.jsp for the sandwich store (10 marks)',figs:[F(OT('Online Sandwich store',['<table><tr><th>Item</th><th>Price</th><th>Quantity</th></tr><tr><td>Chicken Sandwich</td><td>RM1.50</td><td><div class="in">&nbsp;</div></td></tr><tr><td>Beef Sandwich</td><td>RM2.20</td><td><div class="in">&nbsp;</div></td></tr><tr><td>Tuna Sandwich</td><td>RM1.20</td><td><div class="in">&nbsp;</div></td></tr><tr><td>Egg Sandwich</td><td>RM1.00</td><td><div class="in">&nbsp;</div></td></tr></table>','Members ☐','<span class="btn">Compute Payment</span> <span class="btn">Reset</span>']),'The existing HTML page (redrawn from the screenshot)')],prompt:'Members of the Online Sandwich Store get a 20% discount. Write computePayment.jsp to (a) read the form values with the request object, (b) calculate the order payment, and (c) display the quantity of each sandwich, then the total after discount if the user is a member, or the plain total if not. The paper doesn’t show the field names, so my model assumes chicken, beef, tuna, egg and member. Use the names in your form.',model:'<%\n  int chicken = Integer.parseInt(request.getParameter("chicken"));\n  int beef    = Integer.parseInt(request.getParameter("beef"));\n  int tuna    = Integer.parseInt(request.getParameter("tuna"));\n  int egg     = Integer.parseInt(request.getParameter("egg"));\n  boolean member = request.getParameter("member") != null;  // unchecked box sends nothing\n\n  double total = chicken * 1.50 + beef * 2.20 + tuna * 1.20 + egg * 1.00;\n%>\n<html>\n<body>\n  <h2>Online Sandwich store</h2>\n  <p>Chicken Sandwich: <%= chicken %></p>\n  <p>Beef Sandwich: <%= beef %></p>\n  <p>Tuna Sandwich: <%= tuna %></p>\n  <p>Egg Sandwich: <%= egg %></p>\n  <% if (member) { %>\n    <p>Total payment after 20% discount: RM <%= String.format("%.2f", total * 0.80) %></p>\n  <% } else { %>\n    <p>Total payment: RM <%= String.format("%.2f", total) %></p>\n  <% } %>\n</body>\n</html>',check:['(a) Reads the four quantities with request.getParameter and converts them with Integer.parseInt','(a) Member checkbox tested with getParameter(...) != null','(b) Prices used: chicken 1.50, beef 2.20, tuna 1.20, egg 1.00','(b) total = sum of price x quantity','(c) Quantity of each sandwich is displayed','(c) Member: total x 0.80 (20% off); non-member: plain total','(c) if / else done with scriptlets around the HTML lines','Money formatted to 2 decimals']}
